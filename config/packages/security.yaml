security:
    password_hashers:
        App\Entity\Account:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Account
                property: email  

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginAuthenticator
            logout:
                path: app_logout
                target: app_connection
            
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/monCompte, roles: ROLE_USER }