services:
    App\EventListener\LoginSuccessListener:
        tags:
            - { name: kernel.event_listener, event: security.interactive_login, method: onLoginSuccess }
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
        autowire: true
        autoconfigure: true