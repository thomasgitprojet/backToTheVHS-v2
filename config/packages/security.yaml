security:
    password_hashers:
        App\Entity\Account:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Account
                property: email  

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # On utilise ton LoginAuthenticator pour les logins
            custom_authenticator: App\Security\LoginAuthenticator

            logout:
                path: app_logout
                target: app_connection
                # méthode POST est requise par défaut, tu peux ajouter csrf_token if needed

            # Optionnel : activer "remember me" si nécessaire
            # remember_me:
            #     secret: '%kernel.secret%'
            #     lifetime: 604800 # 7 jours
            #     path: /
            
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/monCompte, roles: ROLE_USER }